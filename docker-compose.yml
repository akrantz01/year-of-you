services:
  mariadb:
    image: mariadb:12
    environment:
      MARIADB_RANDOM_ROOT_PASSWORD: 1
    volumes:
      - ./docker/mariadb.sql:/docker-entrypoint-initdb.d/init.sql
      - mariadb:/var/lib/mysql
    ports:
      - "3306:3306"

  mysql:
    image: mysql:9
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: 1
    volumes:
      - ./docker/mysql.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql:/var/lib/mysql
    ports:
      - "3306:3306"

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: year-of-you
      POSTGRES_USER: year-of-you
      POSTGRES_PASSWORD: password
    volumes:
      - postgres:/var/lib/postgresql
    ports:
      - "5432:5432"

volumes:
  mariadb:
  mysql:
  postgres:
